name: Refresh mortgage rate
on:
  schedule:
    - cron: '17 16 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mortgage-rate-refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node refresh-rate.cjs
      - name: Save verified rate
        run: |
          if git diff --quiet -- mortgage-rate.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- mortgage-rate.json
          git commit -m 'Refresh verified Wells Fargo rate'
          git push
